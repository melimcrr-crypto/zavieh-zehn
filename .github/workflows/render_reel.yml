name: Render Zavieh Zehn Reel (60fps Studio v2)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/episodes/ep0[3-9]*.py'
      - 'src/episodes/ep[1-9]*.py'
  workflow_dispatch:
    inputs:
      episode_script:
        description: 'Episode module path'
        required: true
        default: 'src/episodes/ep02_baader_meinhof.py'
      release_tag:
        description: 'GitHub Release tag'
        required: true
        default: 'ep02-baader-meinhof'
      whisper_model:
        description: 'Whisper alignment model (small or medium)'
        required: true
        default: 'medium'

permissions:
  contents: write

jobs:
  render-60fps-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Studio Audio & Vector Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rubberband-cli libcairo2

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Packages & Verify HarfBuzz/Raqm RTL Shaping
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from PIL import features; print('Raqm RTL support:', features.check('raqm')); assert features.check('raqm')"

      - name: Fetch Vazirmatn Typography Weights
        run: |
          mkdir -p fonts
          BASE="https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf"
          for W in Light Regular Medium Bold ExtraBold; do
            curl -fsSL "$BASE/Vazirmatn-${W}.ttf" -o "fonts/Vazirmatn-${W}.ttf"
          done
          ls -lh fonts/

      - name: Synthesize Voice (Rasalgethi + 129-tap FIR), Align & Render 1080x1920 @ 60fps Master Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EP_PATH="${{ github.event.inputs.episode_script || 'src/episodes/ep02_baader_meinhof.py' }}"
          WHISPER_SZ="${{ github.event.inputs.whisper_model || 'medium' }}"
          mkdir -p work out qa_report
          python "$EP_PATH" --cloud-render fonts work out/zavieh_zehn_ep02_baader_meinhof_60fps.mp4 qa_report "$WHISPER_SZ"
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=codec_type,codec_name,profile,width,height,r_frame_rate,sample_rate,channels -of json out/zavieh_zehn_ep02_baader_meinhof_60fps.mp4 | tee qa_report/ffprobe_report.json

      - name: Upload 60fps Master MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zavieh-zehn-ep02-baader-meinhof-60fps
          path: out/zavieh_zehn_ep02_baader_meinhof_60fps.mp4
          if-no-files-found: error

      - name: Upload QA Sheets & Alignment Report
        uses: actions/upload-artifact@v4
        with:
          name: zavieh-zehn-ep02-qa-report
          path: qa_report/
          if-no-files-found: error

      - name: Publish Studio v2 MP4 & QA Sheets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'ep02-baader-meinhof' }}
          name: "اپیزود ۰۲ (نسخه استودیویی v2) — توهم فرکانس (بادر-ماینهوف) | 1080x1920 60fps"
          body: |
            خروجی استودیویی **نسخه v2** اپیزود دوم پیج **زاویه ذهن (`@zavieh.penhann`)**
            - **موضوع:** توهم فرکانس (پدیده‌ی بادر-ماینهوف)
            - **کیفیت تصویر:** `1080×1920` • `60fps` • `H.264 High@L4.2 (-preset slow -crf 14)` • Pure OLED `#000000`
            - **موتور زیرنویس v2:** خط واحد RTL با فونت ثابت `Vazirmatn-Medium 40px` قفل‌شده روی خط کرسی `y=1642.0` (`0.000px` خطای تراز) + مسک گرادیانی نرم `64px` راست‌به‌چپ در ۶۰ فریم‌برثانیه
            - **موتور صوتی v2 (تطبیق آکوستیک `@ensan.besham`):** `Gemini TTS (Rasalgethi)` + فیلتر طیف‌نگاری `129-tap Zero-Phase FIR` + کالیبراسیون `-0.34st Rubberband Formant` (`F0 = 136.4 Hz`, تشابه طیف صوتی `MFCC = 0.9433`) + فشرده‌سازی مکث‌ها به `0.18s` + امبینت دارک `A-minor` در `-32 dBFS`
          files: |
            out/zavieh_zehn_ep02_baader_meinhof_60fps.mp4
            qa_report/ffprobe_report.json
            qa_report/alignment.json
            qa_report/subtitle_strip_verify.png
            qa_report/storyboard_12_scenes.png
