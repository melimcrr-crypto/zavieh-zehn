name: Render Zavieh Zehn Reel (60fps Studio v2.2)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/episodes/ep0[3-9]*.py'
      - 'src/episodes/ep[1-9]*.py'
  workflow_dispatch:
    inputs:
      episode_script:
        description: 'Episode module path (leave empty for latest episode)'
        required: false
        default: ''
      release_tag:
        description: 'GitHub Release tag (leave empty for auto)'
        required: false
        default: ''
      whisper_model:
        description: 'Whisper alignment model (small or medium)'
        required: true
        default: 'medium'

permissions:
  contents: write

jobs:
  render-60fps-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Target Episode Metadata
        id: ep
        run: |
          INPUT_EP="${{ github.event.inputs.episode_script }}"
          if [ -n "$INPUT_EP" ]; then
            EP_PATH="$INPUT_EP"
          else
            EP_PATH=$(ls -1 src/episodes/ep*.py | sort | tail -n 1)
          fi
          STEM=$(basename "$EP_PATH" .py)
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(echo "$STEM" | tr '_' '-')
          fi
          MP4_NAME="zavieh_zehn_${STEM}_60fps.mp4"
          echo "ep_path=$EP_PATH" >> $GITHUB_OUTPUT
          echo "stem=$STEM" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "mp4_name=$MP4_NAME" >> $GITHUB_OUTPUT
          echo "Resolved: EP_PATH=$EP_PATH | TAG=$TAG | MP4=$MP4_NAME"

      - name: Install Studio Audio & Vector Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rubberband-cli libcairo2

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Packages & Verify HarfBuzz/Raqm RTL Shaping
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from PIL import features; print('Raqm RTL support:', features.check('raqm')); assert features.check('raqm')"

      - name: Fetch Vazirmatn Typography Weights
        run: |
          mkdir -p fonts
          BASE="https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf"
          for W in Light Regular Medium Bold ExtraBold; do
            curl -fsSL "$BASE/Vazirmatn-${W}.ttf" -o "fonts/Vazirmatn-${W}.ttf"
          done
          ls -lh fonts/

      - name: Synthesize Locked Rasalgethi Voice, Cinematic Score & Render 1080x1920 @ 60fps Master Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EP_PATH="${{ steps.ep.outputs.ep_path }}"
          MP4_NAME="${{ steps.ep.outputs.mp4_name }}"
          WHISPER_SZ="${{ github.event.inputs.whisper_model || 'medium' }}"
          mkdir -p work out qa_report
          python "$EP_PATH" --cloud-render fonts work "out/$MP4_NAME" qa_report "$WHISPER_SZ"
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=codec_type,codec_name,profile,width,height,r_frame_rate,sample_rate,channels -of json "out/$MP4_NAME" | tee qa_report/ffprobe_report.json

      - name: Upload 60fps Master MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ep.outputs.tag }}-60fps
          path: out/${{ steps.ep.outputs.mp4_name }}
          if-no-files-found: error

      - name: Upload QA Sheets & Alignment Report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ep.outputs.tag }}-qa-report
          path: qa_report/
          if-no-files-found: error

      - name: Publish Studio Master MP4 & QA Sheets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ep.outputs.tag }}
          name: "زاویه ذهن (@zavieh.penhann) — ${{ steps.ep.outputs.tag }} | 1080x1920 60fps Studio Master"
          body: |
            خروجی استودیویی مستر پیج **زاویه ذهن (`@zavieh.penhann`)**
            - **فایل اپیزود:** `${{ steps.ep.outputs.mp4_name }}`
            - **کیفیت تصویر:** `1080×1920` • `60fps` • `H.264 High@L4.2 (-preset slow -crf 14)` • Pure OLED `#000000`
            - **صدای ثابت قفل‌شده:** `Gemini TTS (Rasalgethi)` + فیلتر ۱۲۹ تپ `ENSAN_FIR_24K` + `-0.34st Formant`
            - **موسیقی متن سینمایی:** هارمونی مینور پیش‌رونده (`Am9 -> Fmaj7 -> Dm9 -> Em7`) با پیانوی نمدی و ریورب استریو (`48kHz / 320kbps`)
          files: |
            out/${{ steps.ep.outputs.mp4_name }}
            qa_report/ffprobe_report.json
            qa_report/alignment.json
            qa_report/subtitle_strip_verify.png
            qa_report/storyboard_12_scenes.png
